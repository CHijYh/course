[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kosmoscreen-landscape"
version = "0.1.0"
description = "Local geodata to a watertight printable landscape"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "rasterio>=1.4,<2", "manifold3d>=3.0,<4", "pyvista>=0.44,<0.50"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
landscape = "landscape.__main__:main"

[tool.setuptools.packages.find]
include = ["landscape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

